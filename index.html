* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); }
#nano { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }

.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }

.brand span { color: var(--accent); }
.nav { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding-bottom: 4px; scrollbar-width: thin; }
.nav a, .sub a { flex: 0 0 auto; font: 700 17px var(--f-display); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); text-decoration: none; white-space: nowrap; }

.sub a { font-size: 15px; padding: 6px 12px; border-radius: 8px; }
.hero { padding: 6px 0 0; display: grid; gap: 10px; }

.home h1 { font-size: clamp(46px, 9vw, 88px); line-height: 0.92; }

.home .lead { font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

select, input[type="text"] {
  font: 500 16px var(--f-body); color: var(--ink); background: var(--field); border: 1px solid var(--line); padding: 10px 12px; border-radius: 9px; min-width: 0; width: 100%;

select option, select optgroup { background: #0b121a; color: var(--ink); }

    if (!(d >= 1)) return -1;
    for (var i = 0; i < RANGES.length; i++) if (d > RANGES[i][0] - (i === 0 ? 1 : 0) && d <= RANGES[i][1]) return i;
    return -1;
  }

  function renderTol() {
    $("stage").innerHTML = '<div style="display:grid;gap:22px"><div class="panel"><div class="card fields"><div class="field wide"><label for="tol_d">Dimension nominale</label><div class="row"><input type="text" inputmode="decimal" id="tol_d" value="25" autocomplete="off"><span class="unit">mm</span></div><div class="hint">Valable de 1 à 250 mm.</div></div></div><div class="dro" id="dro" aria-live="polite"></div></div>' +
      '<div class="card scroll"><table class="tol-table" id="tol_t"></table></div><div class="card formula">Cote H (alésage) : 0 / +IT\nCote h (arbre)   : −IT / 0\nCote js          : ± IT / 2</div>' +
      aboutHTML({
        h: "Lire les tolérances ISO et les ajustements H7 / h6",
        p: ["La norme ISO 286 classe la précision en qualités IT. Plus le chiffre est petit, plus la tolérance est serrée. Pour une même qualité, la tolérance grandit avec la dimension nominale.",
          "Un alésage se note avec une majuscule (H7 : de 0 à +IT7), un arbre avec une minuscule (h6 : de −IT6 à 0). Un ajustement H7/h6 est un ajustement juste, qui se monte à la main ou avec un léger effort. H7/g6 donne un jeu glissant, H7/p6 un serrage fort."],
        ex: "Exemple : cote nominale de 25 mm (tranche de 18 à 30)\nH7 : IT7 = 21 µm → 0 / +0,021 mm\nh6 : IT6 = 13 µm → −0,013 / 0 mm"
      }, [["Quelle qualité IT pour un alésage à l'alésoir ?", "Un alésoir donne en général du H7. Pour un trou fini au foret, compte plutôt IT11 à IT12."], ["Quelle différence entre H7 et h6 ?", "H7 désigne un alésage dont la tolérance part de la cote nominale vers le haut. h6 désigne un arbre dont la tolérance part de la cote nominale vers le bas."]]) + "</div>";
    $("tol_d").addEventListener("input", tolTable);
    tolTable();
  }
  function tolTable() {
    var d = parse($("tol_d")), i = rangeIndex(d), dro = $("dro"), t = $("tol_t");
    if (i < 0) { dro.innerHTML = '<div class="cell big"><div class="k">Tranche</div><div class="v">—</div></div><div class="warn">Entre une dimension comprise entre 1 et 250 mm.</div>'; t.innerHTML = ""; return; }
    var rg = RANGES[i];
    dro.innerHTML = '<div class="cell big"><div class="k">Tranche ISO</div><div class="v">' + (i === 0 ? "1" : "> " + rg[0]) + " à " + rg[1] + "<small>mm</small></div></div>" +
      '<div class="cell"><div class="k">Alésage H7</div><div class="v">0 / +' + IT[i][2] + "<small>µm</small></div></div>" +
      '<div class="cell"><div class="k">Arbre h6</div><div class="v">−' + IT[i][1] + " / 0<small>µm</small></div></div>";
    t.innerHTML = '<tr><th>Qualité</th><th>IT (µm)</th><th>IT (mm)</th><th>± IT/2 (mm)</th><th class="l">Usage courant</th></tr>' + GRADES.map(function (g, k) {
      var um = IT[i][k];
      return '<tr class="' + (g === "IT6" || g === "IT7" ? "usual" : "") + '"><td>' + g + "</td><td>" + um + "</td><td>" + fmt(um / 1000, 3) + "</td><td>±" + fmt(um / 2000, 4) + '</td><td class="l">' + USAGE[k] + "</td></tr>";
    }).join("");
  }

  var PAIRS = [
    { a: "Millimètres (mm)", b: "Pouces (in)", k: 25.4, va: 10 },
    { a: "Vitesse de coupe (m/min)", b: "Vitesse de coupe (SFM, pieds/min)", k: 0.3048, va: 100 },
    { a: "Avance (mm/min)", b: "Avance (pouces/min, IPM)", k: 25.4, va: 300 },
    { a: "Avance par tour (mm/tr)", b: "Avance par tour (pouces/tr, IPR)", k: 25.4, va: 0.2 },
    { a: "Puissance (kW)", b: "Puissance (ch)", k: 0.7355, va: 5 }
  ];
  function fmtV(x) { return x.toLocaleString("fr-FR", { maximumFractionDigits: 4, useGrouping: false }); }
  function renderConv() {
    var HARD = [[20, 238, 226], [25, 266, 253], [30, 302, 286], [35, 345, 327], [40, 392, 371], [45, 446, 421], [50, 513, 481], [55, 595, 560], [60, 697, 0]];
    var RUG = [["N3", 0.1], ["N4", 0.2], ["N5", 0.4], ["N6", 0.8], ["N7", 1.6], ["N8", 3.2], ["N9", 6.3], ["N10", 12.5]];
    $("stage").innerHTML = '<div style="display:grid;gap:22px"><div class="card conv">' + PAIRS.map(function (p, i) {
      return '<div class="pair"><div class="field"><label for="cv_a' + i + '">' + p.a + '</label><input type="text" inputmode="decimal" id="cv_a' + i + '" value="' + fmtV(p.va) + '" autocomplete="off"></div><div class="eq">=</div><div class="field"><label for="cv_b' + i + '">' + p.b + '</label><input type="text" inputmode="decimal" id="cv_b' + i + '" value="' + fmtV(p.va / p.k) + '" autocomplete="off"></div></div>';
    }).join("") + "</div>" +
      '<section class="card sec"><h2>Dureté des aciers (valeurs approchées)</h2><div class="scroll"><table class="tol-table"><tr><th>HRC</th><th>HV</th><th>HB</th></tr>' + HARD.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + (r[2] || "—") + "</td></tr>"; }).join("") + "</table></div><p>Les correspondances entre échelles de dureté sont approchées et valables pour les aciers. Pour un contrôle précis, mesure directement dans l'échelle demandée.</p></section>" +
      '<section class="card sec"><h2>Rugosité : classes N et Ra</h2><div class="scroll"><table class="tol-table"><tr><th>Classe</th><th>Ra (µm)</th></tr>' + RUG.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + fmt(r[1], 1) + "</td></tr>"; }).join("") + "</table></div><p>Plus Ra est petit, plus la surface est lisse. Un tournage de finition donne en général N7 à N8, une rectification N5 à N6.</p></section></div>";
    PAIRS.forEach(function (p, i) {
      var a = $("cv_a" + i), b = $("cv_b" + i);
      a.addEventListener("input", function () { var x = parse(a); b.value = isFinite(x) ? fmtV(x / p.k) : ""; });
      b.addEventListener("input", function () { var x = parse(b); a.value = isFinite(x) ? fmtV(x * p.k) : ""; });
    });
  }

  function renderVc() {
    var rows = "";
    ["P", "M", "K", "N", "S", "H", "X"].forEach(function (g) {
      rows += '<tr class="grp" data-g="1"><td colspan="6">' + CA_GROUPS[g] + "</td></tr>";
      CA_MATS.filter(function (m) { return m.g === g; }).forEach(function (m) {
        rows += "<tr><td>" + m.n + "</td><td>" + (m.hss[1] ? m.hss[0] + " à " + m.hss[1] : "—") + "</td><td>" + m.car[0] + " à " + m.car[1] + "</td><td>" + m.kc + "</td><td>" + fmt(m.rho, 2) + "</td><td>" + (m.tap[1] ? fmt(m.tap[0], 1) + " à " + fmt(m.tap[1], 1) : "—") + "</td></tr>";
      });
    });
    $("stage").innerHTML = '<div style="display:grid;gap:22px"><div class="card searchbar"><label class="lbl" for="vc_q" style="flex:1 1 260px">Filtrer<input type="text" id="vc_q" placeholder="inox, alu, 316, titane, POM…" autocomplete="off"></label></div>' +
      '<div class="card scroll"><table class="tol-table vc-table" id="vc_t"><tr><th>Matière</th><th>ARS (m/min)</th><th>Carbure (m/min)</th><th>kc (N/mm²)</th><th>Masse vol. (kg/dm³)</th><th>Taraud (m/min)</th></tr>' + rows + "</table></div>" +
      aboutHTML({
        h: "Comment lire ce tableau",
        p: ["Les vitesses de coupe Vc sont des valeurs de départ pour le fraisage et le tournage avec des outils courants. Le carbure revêtu supporte des vitesses bien plus élevées que l'acier rapide (ARS). Le perçage, l'alésage et le tronçonnage utilisent des fractions de ces valeurs : les calculateurs les appliquent pour toi.",
          "La lettre de la famille vient de la norme ISO 513 : P pour les aciers, M pour les inox, K pour les fontes, N pour les non-ferreux, S pour le titane et les superalliages, H pour les aciers trempés. Si ta matière n'est pas listée, choisis la famille la plus proche ou utilise l'option « Autre matière » dans les calculateurs et entre les valeurs de ton fournisseur.",
          "Un tiret signifie que l'outil ou l'opération n'est pas adapté : par exemple, l'ARS ne convient pas aux aciers trempés."],
        ex: "Vc = π × D × N / 1000        m/min\nExemple : Ø50 à 800 tr/min → Vc = 126 m/min"
      }) + "</div>";
    $("vc_q").addEventListener("input", function () {
      var q = $("vc_q").value.trim().toLowerCase(), trs = qsa("#vc_t tr").slice(1), shown = false;
      var last = null, any = false;
      trs.forEach(function (tr) {
        if (tr.getAttribute("data-g")) { if (last) last.hidden = !any; last = tr; any = false; return; }
        var ok = !q || tr.textContent.toLowerCase().indexOf(q) >= 0;
        tr.hidden = !ok; if (ok) any = true;
      });
      if (last) last.hidden = !any;
    });
  }

  function renderLegal() {
    $("stage").innerHTML = '<div style="display:grid;gap:22px"><section class="card sec"><h2>Éditeur du site</h2><p>Thomas JULIEN, Conflans-Sainte-Honorine.</p><p>Contact : tjulien2003@yahoo.fr</p></section>' +
      '<section class="card sec"><h2>Hébergeur</h2><p>GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis.</p></section>' +
      '<section class="card sec"><h2>Confidentialité</h2><p>Les calculs se font dans ton navigateur : les valeurs que tu saisis ne sont ni envoyées ni enregistrées sur un serveur.</p><p>Le site mémorise dans ton navigateur uniquement ta dernière matière et ton type d\'outil, pour te les reproposer. Tu peux effacer ces données en vidant les données du site dans ton navigateur. Il n\'y a ni compte, ni cookie de suivi.</p></section>' +
      '<section class="card sec"><h2>Avertissement</h2><p>Les résultats sont des valeurs indicatives, calculées avec des formules de mécanique et des données de pratique courante. Ils ne remplacent ni les recommandations du fabricant d\'outils, ni l\'expérience de l\'opérateur, ni un essai préalable. L\'éditeur ne peut être tenu responsable d\'un usage sans vérification.</p></section></div>';
  }

  function renderHome() {
    var h = '<div class="cards">' + GROUPS.map(function (g) {
      return '<section class="card gcard"><h2>' + g.label + "</h2><ul>" + g.pages.map(function (s) { return '<li><a href="' + link(s) + '"><b>' + PG[s].label + "</b><span>" + BLURB[s] + "</span></a></li>"; }).join("") + "</ul></section>";
    }).join("") + "</div>" +
      '<section class="card faq"><h2>Questions fréquentes</h2>' +
      "<details><summary>Comment choisir la vitesse de coupe Vc ?</summary><p>Elle dépend de la matière et de l'outil. L'acier demande une Vc plus faible que l'aluminium, et le carbure supporte une Vc bien plus haute que l'acier rapide (ARS). Choisis ta matière dans le calculateur : la plage conseillée s'affiche. Le catalogue de ton outil reste la référence.</p></details>" +
      "<details><summary>Quelle différence entre fz et f ?</summary><p>L'avance par dent fz s'utilise en fraisage, où chaque dent enlève de la matière. L'avance par tour f s'utilise en tournage et en perçage. En fraisage, l'avance de table vaut Vf = fz × z × N.</p></details>" +
      "<details><summary>Ma matière n'est pas dans la liste</summary><p>Choisis la famille la plus proche, ou sélectionne « Autre matière » dans la liste des matières et entre les valeurs de ton fournisseur (Vc, kc, masse volumique).</p></details>" +
      "<details><summary>Pourquoi limiter la vitesse de broche ?</summary><p>Si le calcul demande 9 000 tr/min et que ta broche s'arrête à 4 000, la vitesse de coupe réelle sera plus basse que prévue. Entre la vitesse maximale de ta broche : le calculateur recalcule Vc et l'avance avec cette limite.</p></details>" +
      "<details><summary>Les résultats sont-ils fiables ?</summary><p>Les formules sont celles du formulaire de mécanique. Les valeurs de Vc et de kc sont des ordres de grandeur de pratique courante. Pour une pièce réelle, suis le catalogue de ton fournisseur d'outils et valide par un essai.</p></details></section>";
    $("stage").innerHTML = h;
  }

  /* ---------- Démarrage de la page ---------- */
  function start() {
    if (SINGLE) { PAGE = location.hash.replace("#", "") || "home"; if (!PG[PAGE]) PAGE = "home"; }
    cur = PG[PAGE] || PG.home;
  setHead();
  shell();
  if (cur.mat) {
    var sel = $("mat");
    sel.value = matId;
    function showCustom() {
      var c = $("custom"); if (!c) return;
      c.hidden = matId !== "custom";
      $("cm_vc").value = fmtIn(cm.vc); $("cm_kc").value = fmtIn(cm.kc); $("cm_rho").value = fmtIn(cm.rho); $("cm_tap").value = fmtIn(cm.tap);
    }
    function setToolUI() {
      var a = $("tool-carb"), b = $("tool-hss");
      if (a) a.setAttribute("aria-pressed", tool === "car" ? "true" : "false");
      if (b) b.setAttribute("aria-pressed", tool === "hss" ? "true" : "false");
    }
    sel.addEventListener("change", function () { matId = sel.value; save(); showCustom(); applyMaterial(); });
    if ($("tool-carb")) {
      $("tool-carb").addEventListener("click", function () { tool = "car"; save(); setToolUI(); applyMaterial(); });
      $("tool-hss").addEventListener("click", function () { tool = "hss"; save(); setToolUI(); applyMaterial(); });
    }
    ["vc", "kc", "rho", "tap"].forEach(function (k) {
      $("cm_" + k).addEventListener("input", function () { var x = parse($("cm_" + k)); cm[k] = isFinite(x) ? x : 0; save(); applyMaterial(); });
    });
    setToolUI(); showCustom();
  }
  if (cur.kind === "tol") renderTol();
  else if (cur.kind === "conv") renderConv();
  else if (cur.kind === "vc") renderVc();
  else if (cur.kind === "legal") renderLegal();
  else if (cur.kind === "home") renderHome();
  else renderCalc();

  }
  start();
  if (SINGLE) window.addEventListener("hashchange", function () { start(); window.scrollTo(0, 0); });

  /* ---------- Nanobots : essaim en fond, suit la souris, un clic les projette ---------- */
  (function nano() {
    var cv = $("nano"); if (!cv) return;
    var ctx = cv.getContext("2d");
    var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    var W = 0, H = 0, dpr = 1, bots = [], ripples = [], TAU = Math.PI * 2, t = 0, last = 0;
    var ptr = { x: -9999, y: -9999, down: false, active: false };
    var RGB = "82,230,255";
    function size() {
      var w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h || (w === W && h === H)) return;
      W = w; H = h; dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      var n = Math.min(700, Math.round(W * H / 2600));
      if (reduce) n = Math.round(n * 0.25);
      while (bots.length < n) bots.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, s: 0.45 + Math.random() * 0.9, sp: 0 });
      bots.length = n;
    }
    function onControl(e) { return !!(e.target && e.target.closest && e.target.closest("a,button,input,textarea,select,summary,label")); }
    window.addEventListener("pointermove", function (e) { ptr.x = e.clientX; ptr.y = e.clientY; ptr.active = true; }, { passive: true });
    window.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      ptr.x = e.clientX; ptr.y = e.clientY; ptr.active = true;
      if (onControl(e)) return;
      ptr.down = true; ripples.push({ x: ptr.x, y: ptr.y, r: 6, a: 0.8 });
    }, { passive: true });
    window.addEventListener("pointerup", function () {
      if (!ptr.down) return;
      ptr.down = false;
      var R = 460;
      for (var i = 0; i < bots.length; i++) {
        var b = bots[i], dx = b.x - ptr.x, dy = b.y - ptr.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < R) { var imp = (1 - d / R) * 11; b.vx += dx / d * imp; b.vy += dy / d * imp; }
      }
      ripples.push({ x: ptr.x, y: ptr.y, r: 10, a: 1 });
    }, { passive: true });
    window.addEventListener("pointercancel", function () { ptr.active = false; ptr.down = false; }, { passive: true });
    document.addEventListener("mouseleave", function () { ptr.active = false; ptr.down = false; });
    window.addEventListener("resize", size);
    var g0 = [], g1 = [], g2 = [];
    function streaks(list, width, alpha, color, len) {
      if (!list.length) return;
      ctx.beginPath();
      for (var j = 0; j < list.length; j++) {
        var b = list[j], sp = b.sp || 0.01, L = len * (0.6 + Math.min(sp, 3.5) * 0.3);
        ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / sp * L, b.y - b.vy / sp * L);
      }
      ctx.lineWidth = width; ctx.strokeStyle = "rgba(" + color + "," + alpha + ")"; ctx.stroke();
    }
    function frame(ts) {
      requestAnimationFrame(frame);
      if (document.hidden) return;
      size();
      if (!W) return;
      var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
      var k = dt * 60 * (reduce ? 0.4 : 1); t += dt;
      var R = 230;
      g0.length = 0; g1.length = 0; g2.length = 0;
      for (var i = 0; i < bots.length; i++) {
        var b = bots[i];
        var a = Math.sin(b.x * 0.0031 + t * 0.2) * 2 + Math.cos(b.y * 0.0036 - t * 0.17) * 2 + b.s;
        var tx = Math.cos(a) * b.s, ty = Math.sin(a) * b.s, ax = 0, ay = 0;
        if (ptr.active) {
          var dx = ptr.x - b.x, dy = ptr.y - b.y, d = Math.sqrt(dx * dx + dy * dy) || 1, reach = ptr.down ? R * 2.2 : R;
          if (d < reach) {
            var f = 1 - d / reach, nx = dx / d, ny = dy / d;
            if (ptr.down) { ax += nx * f * 1.5 + (-ny) * f * 1.1; ay += ny * f * 1.5 + nx * f * 1.1; }
            else if (d < 46) { ax -= nx * (1 - d / 46) * 0.8; ay -= ny * (1 - d / 46) * 0.8; }
            else { ax += nx * f * 0.1 + (-ny) * f * 0.5; ay += ny * f * 0.1 + nx * f * 0.5; }
          }
        }
        b.vx += ((tx - b.vx) * 0.03 + ax * 0.5) * k;
        b.vy += ((ty - b.vy) * 0.03 + ay * 0.5) * k;
        var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (sp > 8) { b.vx *= 8 / sp; b.vy *= 8 / sp; sp = 8; }
        b.sp = sp; b.x += b.vx * k; b.y += b.vy * k;
        if (b.x < -10) b.x = W + 10; else if (b.x > W + 10) b.x = -10;
        if (b.y < -10) b.y = H + 10; else if (b.y > H + 10) b.y = -10;
        (sp < 0.7 ? g0 : (sp < 2 ? g1 : g2)).push(b);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      streaks(g0, 3.4, 0.3, RGB, 3);
      streaks(g1, 3.8, 0.62, RGB, 4);
      streaks(g2, 4.2, 0.9, "255,255,255", 5);
      if (ptr.active) {
        var rad = ptr.down ? 70 : 46, gr = ctx.createRadialGradient(ptr.x, ptr.y, 0, ptr.x, ptr.y, rad);
        gr.addColorStop(0, "rgba(" + RGB + "," + (ptr.down ? 0.5 : 0.26) + ")"); gr.addColorStop(1, "rgba(" + RGB + ",0)");
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ptr.x, ptr.y, rad, 0, TAU); ctx.fill();
      }
      for (var q = ripples.length - 1; q >= 0; q--) {
        var rp = ripples[q]; rp.r += 340 * dt; rp.a -= 1.3 * dt;
        if (rp.a <= 0) { ripples.splice(q, 1); continue; }
        ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, TAU);
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(" + RGB + "," + (rp.a * 0.7) + ")"; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  })();
})();
